<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dreykit: free everyday tools</title>
    <meta name="description" content="Free browser tools: QR codes, passwords, calculator, timers, text tools, unit converter and notes." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet" />
    <script>
      try {
        var t = localStorage.getItem('dreykit-theme');
        if (t ? JSON.parse(t) === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
